name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system test tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install project
        run: python -m pip install --disable-pip-version-check -e '.[test]'

      - name: Check shell syntax
        run: bash -n install.sh installer/*.sh scripts/*.sh tests/*.sh

      - name: Check streamed installer entrypoint
        run: bash -s -- --help < install.sh >/dev/null

      - name: Test legacy installer migration
        run: |
          sudo bash tests/test-data-root-permissions.sh
          bash tests/test-installer-migration.sh

      - name: Run test suite
        run: python -m pytest -q
