name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system test tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install project
        run: python -m pip install --disable-pip-version-check -e '.[test]'

      - name: Check shell syntax
        run: bash -n install.sh installer/*.sh scripts/*.sh tests/*.sh

      - name: Check streamed installer entrypoint
        run: bash -s -- --help < install.sh >/dev/null

      - name: Test data root permissions and installer migration paths
        run: |
          sudo bash tests/test-data-root-permissions.sh
          sudo bash tests/test-native-stack-lock.sh
          sudo bash tests/test-cuda-toolkit-contract.sh
          sudo bash tests/test-installer-cuda-preflight.sh
          bash tests/test-installer-migration.sh
          bash tests/test-installer-git-upgrade.sh

      - name: Run test suite
        run: python -m pytest -q

      - name: Build and inspect distributable wheel
        if: matrix.python-version == '3.12'
        run: |
          python -m pip wheel --no-deps . --wheel-dir dist
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path("dist").glob("*.whl"))
          assert len(wheels) == 1, wheels
          with ZipFile(wheels[0]) as archive:
              names = set(archive.namelist())
          expected_static = {
              path.relative_to("src").as_posix()
              for path in Path("src/dub_server/web_static").rglob("*")
              if path.is_file()
          }
          wheel_static = {
              name for name in names if name.startswith("dub_server/web_static/")
          }
          assert wheel_static == expected_static, (wheel_static - expected_static, expected_static - wheel_static)
          assert "dub_server/web_static/index.html" in names
          assert "dub_server/web_static/og.png" in names
          assert any(name.startswith("dub_server/web_static/assets/") and name.endswith(".css") for name in names)
          assert any(name.startswith("dub_server/web_static/assets/") and name.endswith(".js") for name in names)
          assert any(name.endswith(".dist-info/licenses/LICENSE") for name in names)
          assert any(name.endswith(".dist-info/licenses/THIRD_PARTY_NOTICES.md") for name in names)
          PY

  web:
    runs-on: ubuntu-22.04

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.13.1"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Lint dashboard
        run: npm run lint

      - name: Test and build dashboard
        run: npm test

      - name: Validate release SBOM against CycloneDX 1.6
        run: npm run validate:sbom

      - name: Verify embedded production assets
        run: |
          npm run embed
          git diff --exit-code -- ../src/dub_server/web_static

  windows-contract:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project test dependencies
        run: python -m pip install --disable-pip-version-check -e ".[test]"

      - name: Parse PowerShell entrypoints
        shell: powershell
        run: |
          $parseErrors = New-Object System.Collections.Generic.List[string]
          Get-ChildItem windows -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            )
            foreach ($parseError in $errors) {
              $parseErrors.Add("$($_.Name): $($parseError.Message)")
            }
          }
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Write-Error
            exit 1
          }

      - name: Run Windows contracts
        run: >-
          python -m pytest -q
          tests/test_windows_native_contract.py
          tests/test_gpu.py
          tests/test_release_contract.py
          tests/test_cli.py
